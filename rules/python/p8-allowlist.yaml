rules:
  - id: path-guard-audit-p8-python-env-killswitch
    message: >-
      An environment variable whose name reads as a path-guard bypass
      (ALLOW_ANY_PATH, ALLOW_LOCAL_*, DISABLE_*_PATH/GUARD/SANDBOX,
      BYPASS_*, UNSAFE/INSECURE variants on path/root/dir/file words) is
      read here (P8: env kill-switch). When it gates a path check the
      guard is an operator-set flag, not a control; verify the flag
      cannot disable validation on caller-supplied paths.
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      subcategory: [audit]
      guard_class: P8
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      confidence: MEDIUM
      likelihood: LOW
      impact: MEDIUM
      technology: [pathtraversal, python]
      references:
        - docs/source-sink-matrix.md
    # Search mode: the env read is the finding; no taint involved. The
    # variable name must be a string literal carrying both a bypass word
    # (ALLOW/BYPASS/DISABLE/SKIP/UNSAFE/INSECURE/DANGEROUS/PERMISSIVE/NO_)
    # and a filesystem word (PATH/DIR/FILE/ROOT/FOLDER/GUARD/SANDBOX/
    # TRAVERSAL/RESTRICT), so telemetry flags and unrelated toggles do
    # not fire.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: os.environ.get($V, ...)
                  - pattern: os.getenv($V, ...)
                  - pattern: os.environ[$V]
              - metavariable-regex:
                  metavariable: $V
                  regex: '(?i)[a-z_0-9.]*["\x27][A-Z0-9_]*(ALLOW|BYPASS|DISABLE|SKIP|UNSAFE|INSECURE|DANGEROUS|PERMISSIVE|NO_)[A-Z0-9_]*(PATH|DIR|FILE|ROOT|FOLDER|GUARD|SANDBOX|TRAVERSAL|RESTRICT|JAIL)[A-Z0-9_]*["\x27]'
          # The same kill-switch spelled as an env-name constant:
          # _UNSAFE_PATHS_ENV = "ALLOW_UNSAFE_PATHS", then read through a
          # helper like os.environ.get(name).
          - patterns:
              - pattern: $N = $V
              - metavariable-regex:
                  metavariable: $V
                  regex: '(?i)^["\x27][A-Z0-9_]*(ALLOW|BYPASS|DISABLE|SKIP|UNSAFE|INSECURE|DANGEROUS|PERMISSIVE|NO_)[A-Z0-9_]*(PATH|DIR|FILE|ROOT|FOLDER|GUARD|SANDBOX|TRAVERSAL|RESTRICT|JAIL)[A-Z0-9_]*["\x27]$'

  - id: path-guard-audit-p8-python-default-off
    message: >-
      A root/allowlist-shaped name (allowed_paths, permitted_roots,
      path_whitelist, ALLOWED_DIRS, ...) is declared with an empty or off
      default (None, [], {}, False, Field(default=...)) (P8: guard off by
      default). A tool can ship an allowed-paths list defaulting to empty,
      which makes the guard a no-op until an operator opts in.
    severity: WARNING
    languages: [python]
    metadata:
      category: security
      subcategory: [audit]
      guard_class: P8
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      confidence: MEDIUM
      likelihood: LOW
      impact: MEDIUM
      technology: [pathtraversal, python]
      references:
        - docs/source-sink-matrix.md
    patterns:
      - pattern-either:
          - pattern: $V = None
          - pattern: $V = []
          - pattern: $V = {}
          - pattern: $V = False
          - pattern: "$V: $T = None"
          - pattern: "$V: $T = ..."
          - pattern: $V = Field(default=None)
          - pattern: $V = Field(default_factory=list)
          - pattern: $V = Field(default_factory=set)
          - pattern: $V = Field(default_factory=dict)
          - pattern: $V = field(default=None)
          - pattern: $V = field(default_factory=list)
      - metavariable-regex:
          metavariable: $V
          regex: '(?i)^[a-z_0-9]*((allow|permit|white_?list)[a-z_0-9]*(path|dir|root|file|folder|name)s?|(path|dir|root|file|folder|name)s?_?(allow|permit|white_?list))[a-z_0-9]*$'
